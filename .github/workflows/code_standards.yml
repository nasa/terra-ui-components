name: Code Standards

on:
    pull_request:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-and-format:
        name: Format, Lint, Test, and Typecheck (Blocking)
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Install Playwright Browsers and Dependencies
              run: |
                  export DEBIAN_FRONTEND=noninteractive
                  sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
                  npx playwright install --with-deps

            - name: Run Verify
              id: verify
              run: npm run verify


    security-audit:
        name: Dependency Audit (Advisory)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Run npm audit (Non-Blocking)
              id: audit
              continue-on-error: true
              run: npm audit
