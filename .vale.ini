StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = NASA-Terra

[*.md]
BasedOnStyles = NASA, PlainLanguage
# Ignore Eleventy component-metadata shortcodes and inline code spans
TokenIgnores = (\[component-metadata:[^\]]+\]), (`[^`]+`)
# Ignore Eleventy interactive HTML preview blocks
BlockIgnores = (?s) *```html:preview.*?```

[*.ts]
BasedOnStyles = NASA, PlainLanguage
# Ignore inline code and JSDoc @tags in TypeScript comments
TokenIgnores = (`[^`]+`), (@\w+)

[*.html]
BasedOnStyles = NASA, PlainLanguage

